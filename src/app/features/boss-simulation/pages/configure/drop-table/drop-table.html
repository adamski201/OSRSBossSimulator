<div class="drop-table">
  <table class="items-table">
    <thead>
      <tr class="table-header">
        <th>Item</th>
        <th>Quantity</th>
      </tr>
    </thead>
    <tbody>
      @for (item of items(); track item.id; let i = $index) {
        <tr>
          <td class="item-info">
            <img [src]="item.imageUrl" [alt]="item.name" class="item-icon" />
            <span>{{ item.name }}</span>
          </td>
          <td class="quantity-input">
            <input
              type="number"
              min="0"
              class="quantity-field"
              [value]="value().get(item.id) || 0"
              (input)="onQuantityChange(item.id, +$event.target.value || 0)"
            />
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>
