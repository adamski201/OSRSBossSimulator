<div class="header-box">
  <div class="select-header">
    <span>Bosses</span>
    <button class="header-button" (click)="toggleDropdown()">
      {{ isOpen() ? "▾" : "▸" }}
    </button>
  </div>
  <div class="filter">
    <input
      #query
      type="text"
      placeholder="Filter bosses..."
      (input)="onSearchUpdated(query.value)"
    />
  </div>
</div>
@if (isOpen()) {
  <div class="card-container fade-in">
    @for (boss of filteredBosses(); track boss.id) {
      <app-boss-card [item]="boss"></app-boss-card>
    }
  </div>
}
