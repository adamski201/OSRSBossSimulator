<form class="form-container" [formGroup]="form" (ngSubmit)="onSubmit()">
  <div class="mode-card-container">
    <app-mode-select-card
      formControlName="mode"
      title="Greenlog"
      description="Run Until GreenLog"
      imageUrl=""
      value="greenlog"
    ></app-mode-select-card>
    <app-mode-select-card
      formControlName="mode"
      title="numberOfKills"
      description="numberOfKills"
      imageUrl=""
      value="numberOfKills"
    ></app-mode-select-card>
    <app-mode-select-card
      formControlName="mode"
      title="numberOfItems"
      description="Run Until numberOfItems"
      imageUrl=""
      value="numberOfItems"
    ></app-mode-select-card>
  </div>

  @if (form.get("mode")?.value === "numberOfKills") {
    <label>
      <input type="number" formControlName="numberOfKills" />
      KC
    </label>
  }

  @if (form.get("mode")?.value === "numberOfItems") {
    <label>
      <input type="text" formControlName="numberOfItems" />
      Items
    </label>
  }

  <button class="submit-button" type="submit">Submit</button>
</form>
