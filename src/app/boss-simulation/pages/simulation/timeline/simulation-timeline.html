<div
  class="timeline-grid"
  [ngClass]="{ 'background-fade-in': backgroundVisible() }"
>
  @for (kill of kills(); track $index) {
    <div
      class="cell-wrapper"
      [style.animationDelay]="kill.kc * ANIMATION_DELAY + 'ms'"
    >
      <div class="cell-images">
        @for (drop of kill.drops; track $index) {
          <img
            class="cell-image"
            [ngClass]="{ 'green-border': drop.isGreenlogDrop }"
            [src]="drop.item.imageUrl"
            [title]="drop.item.name"
          />
        }
      </div>
      <div
        class="cell-pill"
        [ngClass]="{
          green: kill.isGreenlogKill,
          large: kill.kc % 10 === 0,
        }"
      ></div>
      @if (kill.kc % 10 === 0) {
        <span class="cell-label">{{ kill.kc }}</span>
      }
    </div>
  }
</div>
